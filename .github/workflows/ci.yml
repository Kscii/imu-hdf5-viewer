name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install h5py numpy
      - run: ffmpeg -version
      - run: python scripts/create-test-fixtures.py tests/fixtures
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
